# FOR TESTING
# CONFIG FILE FOR A DETERMINISTIC, SHORT-HORIZON SIMULATION RUN
#
# Used by the integration test (RunSimPathsIntegrationTest). Settings mirror
# the SimPathsUK integration test so that golden-output diffs behave the same
# way: fixed seed, small population, 3-year horizon, GUI off, integrationTest
# flag on (redirects output to output/INTEGRATION_TESTS).
#
# This file can be used to override defaults for multirun arguments.
# Arguments of the SimPathsMultiRun object overridden by the command-line.

countryString: "Poland"
maxNumberOfRuns: 2
executeWithGui: false
randomSeed: 100
startYear: 2019
endYear: 2022
popSize: 20000
integrationTest: true

parameter_args:
  trainingFlag: false

collector_args:
    persistStatistics: true
    persistStatistics2: true
    persistAlignmentAdjustmentFactors: true
    persistEmploymentStatistics: true
    persistHealthStatistics: true
    persistPersons: false
    persistBenefitUnits: false
    persistHouseholds: false
